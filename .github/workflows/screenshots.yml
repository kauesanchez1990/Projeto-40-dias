name: Capturas de tela

# Roda num emulador Android, abre o app e captura as telas.
# Dispara quando a mensagem do commit contém [screenshots] (ou manualmente).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Permissão do gradlew
        run: chmod +x gradlew

      - name: Compilar APKs de app e teste
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador e capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class br.com.projeto40dias.ScreenshotTest br.com.projeto40dias.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.log
            adb exec-out run-as br.com.projeto40dias tar -cf - -C files screenshots > shots.tar

      - name: Extrair capturas
        run: |
          mkdir -p out
          tar -xf shots.tar -C out
          ls -la out/screenshots
          cat instrument.log

      - uses: actions/upload-artifact@v4
        with:
          name: capturas-de-tela
          path: |
            out/screenshots
            instrument.log
